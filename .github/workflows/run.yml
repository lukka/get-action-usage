name: 'update graph.html'

on:
  schedule:
    - cron: '0 0 * * 6'
    #- cron: '24 17 11 12 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_test:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: '${{ matrix.os }}: run'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_WORKSPACES }}
        path: getactionusage

    - uses: actions/checkout@v4
      name: Fetch the web site repo to update.
      with:
        token: ${{ secrets.PAT_WORKSPACES }}
        repository: lukka/lukka.github.io
        path: lukkagithubio
        ref: main

    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    #- run: |
    #    npm install
    #    npm run build/pack
    - uses: ./getactionusage
      id: scan-usage
      name: Scan GitHub public repositories
      env:
        GITHUB_TOKEN: ${{ secrets.PAT_WORKSPACES }}

    - name: Record usage trend snapshot
      id: record-history
      if: steps.scan-usage.outputs.collection-ran == 'true'
      working-directory: getactionusage
      run: |
        npm ci --ignore-scripts
        npm run history:record
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      with:
        name: results
        path: |
          ${{ github.workspace }}/getactionusage/graph/action-usage-db.json
          ${{ github.workspace }}/getactionusage/graph/usage-history.json
    
    - name: Check for modified DB content
      id: action-usage-db-check
      run: echo "modified=$(if [ -n "$(cd getactionusage && git status --porcelain)" ]; then echo "true"; else echo "false"; fi)" >> $GITHUB_OUTPUT

    - name: Commit DB content and update CRON job
      if: steps.action-usage-db-check.outputs.modified == 'true'
      run: |
        cd getactionusage
        git config --global user.name 'Luca'
        git config --global user.email '681992+lukka@users.noreply.github.com'
        git remote set-url origin https://x-access-token:${{ secrets.PAT_WORKSPACES }}@github.com/${{ github.repository }}
        git add -A
        git add -f ./graph/action-usage-db.json ./graph/usage-history.json
        git status
        git commit -m "Automated commit for DB JSON file and updated CRON job"
        git push
      continue-on-error: true

    - name: Publish updated action explorer and database
      if: steps.scan-usage.outputs.collection-ran == 'true'
      shell: bash
      run: |
        cd lukkagithubio
        mkdir -pv ./graph/
        files=(graph.html graph.css explorer.js canvas-graph.js model.js data-worker.js trends.js action-usage-db.json usage-history.json)
        for file in "${files[@]}"; do
          cp "../getactionusage/graph/$file" "./graph/$file"
          git add -f "./graph/$file"
        done
        if git diff --cached --quiet; then
          echo "Explorer and database are already up to date."
          exit 0
        fi
        git config user.name 'Luca'
        git config user.email '681992+lukka@users.noreply.github.com'
        git remote set-url origin https://x-access-token:${{ secrets.PAT_WORKSPACES }}@github.com/lukka/lukka.github.io
        git commit -m "Automated commit for publishing updated action explorer"
        git push

    - name: Report usage snapshot failure
      if: always() && steps.record-history.outcome == 'failure'
      run: |
        echo "::error::Usage trend snapshot recording failed. Review the recording step; database persistence is handled independently."
        exit 1
