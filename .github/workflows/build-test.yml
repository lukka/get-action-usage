name: 'build-test'

on:
  pull_request:
  workflow_dispatch:

jobs:
  build_and_test:
    name: '${{ matrix.os }}: run'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_WORKSPACES }}
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    - run: |
        npm ci
        npm run pack
        npm run test -- --runInBand
    - name: Verify generated explorer assets
      shell: bash
      run: |
        git diff --exit-code HEAD -- 'graph/*.js'
        untracked=$(git ls-files --others -- 'graph/*.js')
        if [ -n "$untracked" ]; then
          printf '%s\n' "::error::Generated explorer JavaScript must be committed:" "$untracked"
          exit 1
        fi
    - name: Install browser
      run: npx playwright install --with-deps chromium
    - name: Test explorer interactions and scale
      run: npm run test:browser
